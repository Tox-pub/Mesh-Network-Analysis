name: mesh_aop_network
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Python version. 3.13 is excluded: node2vec (installed via pip below) needs
  # numpy<2.0, which has no cp313 wheel. Use 3.11 or 3.12.
  - python>=3.11,<3.13

  # Dependencies (Resolved by Mamba). numpy/networkx are capped to match the
  # node2vec constraints so conda and pip agree on the same majors.
  - numpy>=1.26.0,<2.0
  - pandas>=2.2.2
  - scipy>=1.16.3
  - scikit-learn>=1.6.1
  - statsmodels>=0.14.6
  - matplotlib>=3.10.0
  - seaborn>=0.13.2
  - networkx>=2.8.8,<3.0
  - plotly>=6.1.1
  - openpyxl>=3.1.5
  - biopython>=1.85
  - tqdm>=4.67.1
  - requests>=2.32.4
  
  # Package Installer
  - pip
  - pip:
    - -e .