[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh_aop_network"
version = "3.0.0"
description = "Pipeline and desktop workbench for MeSH term AOP network generation and analysis"
# Validated on Python 3.11-3.13; capped at <3.14 to match environment.yml and the
# validated stack (node2vec is vendored in node2vec_embedding.py, so 3.13 is fully
# supported). Raise the cap deliberately to adopt a newer, untested Python.
requires-python = ">=3.11,<3.14"
# Upper bounds are pinned to the validated versions (the v2.2 numpy-2 / networkx-3
# stack) so future minor/major releases cannot silently break the pipeline. Patch
# updates are still allowed; raise a cap on purpose to adopt a newer minor/major
# (newer library versions can be used, but with caution).
dependencies = [
    "adjustText>=0.8,<1.5",
    "biopython>=1.85,<1.88",
    "kaleido>=1.3.0,<1.4",
    "matplotlib>=3.10.0,<3.12",
    "gensim>=4.3.3,<4.5",
    "networkx>=2.8.8,<3.7",
    "numpy>=1.26,<2.6",
    "openpyxl>=3.1.5,<3.2",
    "pandas>=2.2.2,<3.1",
    "plotly>=6.1.1,<6.9",
    "pymarc>=5.2.3,<5.4",
    "python-louvain>=0.16,<0.17",
    "requests>=2.32.4,<2.35",
    "scikit-learn>=1.6.1,<1.10",
    "scipy>=1.16.3,<1.19",
    "seaborn>=0.13.2,<0.14",
    "statsmodels>=0.14.6,<0.15",
    "tqdm>=4.67.1,<4.69"
]

[project.scripts]
mesh-check-env = "mesh_aop.check_env:main"
mesh-pipeline = "mesh_aop.cli:main"
# Desktop front-end. Uses only tkinter from the standard library, so it adds no
# dependency beyond what the pipeline already requires.
mesh-workbench = "mesh_workbench.__main__:main"

# Explicit src-layout package discovery. setuptools already auto-discovers the single
# package under src/, but stating it makes editable installs deterministic across
# environments (e.g. cloud/Colab, where auto-discovery has occasionally been flaky).
[tool.setuptools.packages.find]
where = ["src"]
