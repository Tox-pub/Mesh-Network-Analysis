# Build one package per operating system, on that operating system.
#
# Three assets, three platforms, one command to trigger them:
#
#   MeSH-Workbench-<version>-windows.msi        double-click, installs per user
#   MeSH-Workbench-<version>-linux.tar.gz       extract, ./install.sh
#   MeSH-Workbench-<version>-macos.tar.gz       extract, ./install.sh
#
# This exists because the Windows artefacts cannot be built anywhere but
# Windows, and the developer machine is Windows - so the macOS and Linux halves
# had no way to be produced at all. GitHub's runners have all three.
#
# Trigger: push a tag (v3.1.0), or run it by hand from the Actions tab.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 3.1.0)'
        required: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The portable tree is the input to the MSI: the MSI is a wrapper around
      # it, not a separate build. --no-zip because the zip is not a release
      # asset any more; one artefact per platform is the whole point.
      - name: Assemble the application tree
        run: python packaging/build_portable_windows.py --out build --no-zip

      - name: Install WiX
        run: |
          dotnet tool install --global wix
          wix extension add --global WixToolset.UI.wixext

      - name: Build the MSI
        run: python packaging/build_msi_windows.py --portable build/MeshWorkbench --out build

      - name: Name it for the platform
        shell: bash
        run: |
          ver=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          mv build/*.msi "MeSH-Workbench-${ver}-windows.msi"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: 'MeSH-Workbench-*-windows.msi'

  # macOS and Linux ship the same thing - the source plus install.sh, which
  # creates a private virtualenv and a launcher. They are built and named
  # separately so that a user downloads the file with their own system's name
  # on it rather than working out which of two identical archives is theirs.
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Proves install.sh works on this platform before anyone downloads it.
      # tkinter is checked by the script itself and is absent from the Ubuntu
      # runner's Python by default, which is exactly the failure a user hits.
      - name: Install tkinter (Linux)
        if: matrix.label == 'linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Install it, the way a user would
        run: |
          chmod +x packaging/install.sh
          ./packaging/install.sh --prefix "$HOME/mw-test"

      - name: Check the installed program answers
        run: |
          "$HOME/mw-test/venv/bin/mesh-pipeline" --version
          "$HOME/mw-test/venv/bin/python" -c "import mesh_aop, mesh_workbench; print('imports OK')"

      - name: Build the archive
        run: |
          ver=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          name="MeSH-Workbench-${ver}"
          git archive --format=tar.gz --prefix="${name}/" \
              -o "${name}-${{ matrix.label }}.tar.gz" HEAD

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: 'MeSH-Workbench-*.tar.gz'

  publish:
    needs: [windows, unix]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Download the one file for your system.

            | System | File | How to install |
            | :--- | :--- | :--- |
            | Windows | `...-windows.msi` | Double-click. Installs for you alone, no administrator rights. |
            | Linux | `...-linux.tar.gz` | Extract, then `./packaging/install.sh` |
            | macOS | `...-macos.tar.gz` | Extract, then `./packaging/install.sh` |

            Linux and macOS need Python 3.11-3.13 with tkinter
            (`sudo apt install python3-tk`, or `brew install python-tk`).
            The installer checks for both before it changes anything.
